[profile.default]
src = "src"
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50

[profile.ci]
fuzz = { runs = 10000, seed = "0x1" }
invariant = { runs = 1000, depth = 100 }
