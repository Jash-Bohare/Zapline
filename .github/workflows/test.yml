name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Foundry Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check Formatting
        run: forge fmt --check

      - name: Run Tests
        run: |
          RPC="${{ secrets.MAINNET_RPC_URL }}"
          # Fallback to verified endpoint if secret is unset or invalid
          if [ -z "$RPC" ] || ! curl -s -X POST "$RPC" -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' | grep -q "result"; then
            RPC="https://eth-mainnet.g.alchemy.com/v2/DXOscKInGgzds_GM2GSTG"
          fi
          MAINNET_RPC_URL="$RPC" FORK_BLOCK="26131429" forge test -vv
