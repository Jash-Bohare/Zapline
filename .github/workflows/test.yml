name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
      FORK_BLOCK: ${{ vars.FORK_BLOCK || '26131429' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Validate and configure environment
        run: |
          if [ -z "$MAINNET_RPC_URL" ]; then
            echo "::error::MAINNET_RPC_URL secret is not configured in GitHub Secrets. Please add MAINNET_RPC_URL under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Sanitize MAINNET_RPC_URL (remove accidental variable prefix, quotes, whitespace)
          CLEAN_RPC=$(echo "$MAINNET_RPC_URL" | sed -e 's/^MAINNET_RPC_URL=//' -e 's/^[ \t]*//' -e 's/[ \t]*$//' -e 's/^["'\'']//' -e 's/["'\'']$//')
          echo "MAINNET_RPC_URL=$CLEAN_RPC" >> $GITHUB_ENV

          # Sanitize FORK_BLOCK
          CLEAN_BLOCK=$(echo "$FORK_BLOCK" | sed -e 's/^FORK_BLOCK=//' -e 's/^[ \t]*//' -e 's/[ \t]*$//' -e 's/^["'\'']//' -e 's/["'\'']$//')
          if [ -z "$CLEAN_BLOCK" ]; then
            CLEAN_BLOCK="26131429"
          fi
          echo "FORK_BLOCK=$CLEAN_BLOCK" >> $GITHUB_ENV

          # Test RPC connection
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' "$CLEAN_RPC" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::RPC connectivity check failed with HTTP status $HTTP_CODE. Please verify your MAINNET_RPC_URL secret."
            exit 1
          fi
          echo "RPC connectivity check passed (HTTP 200)."

      - name: Run Forge tests
        run: FOUNDRY_PROFILE=ci forge test -vvv

      - name: Run Forge snapshot
        run: forge snapshot --check

      - name: Run Forge coverage
        run: forge coverage --report summary --no-match-coverage "(test|script|mocks)"

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
