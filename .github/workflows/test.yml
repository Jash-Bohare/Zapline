name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
      FORK_BLOCK: ${{ vars.FORK_BLOCK || '26131429' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Validate and configure environment
        run: |
          if [ -z "$MAINNET_RPC_URL" ]; then
            echo "::error::MAINNET_RPC_URL secret is not configured in GitHub Secrets. Please add MAINNET_RPC_URL under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Strip carriage returns (\r), newlines (\n), whitespace, quotes, and variable name prefix
          CLEAN_RPC=$(printf '%s' "$MAINNET_RPC_URL" | tr -d '\r\n\t "' | sed -e 's/^MAINNET_RPC_URL=//' -e "s/^'//" -e "s/'$//")

          if [[ "$CLEAN_RPC" != http* ]]; then
            echo "::error::MAINNET_RPC_URL must start with https:// (e.g. https://eth-mainnet.g.alchemy.com/v2/YOUR_KEY). It looks like only an API key or invalid string was entered."
            exit 1
          fi

          echo "MAINNET_RPC_URL=$CLEAN_RPC" >> $GITHUB_ENV

          # Strip carriage returns, whitespace, and quotes from FORK_BLOCK
          CLEAN_BLOCK=$(printf '%s' "$FORK_BLOCK" | tr -d '\r\n\t "' | sed -e 's/^FORK_BLOCK=//' -e "s/^'//" -e "s/'$//")
          if [ -z "$CLEAN_BLOCK" ]; then
            CLEAN_BLOCK="26131429"
          fi
          echo "FORK_BLOCK=$CLEAN_BLOCK" >> $GITHUB_ENV

          # Test RPC connection
          RPC_RESP=$(curl -sS --max-time 15 -X POST -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' "$CLEAN_RPC" 2>&1 || true)
          if [[ "$RPC_RESP" != *"result"* ]]; then
            echo "::error::RPC test failed. Response: $RPC_RESP"
            exit 1
          fi
          echo "RPC connectivity verified successfully."

      - name: Run Forge tests
        run: FOUNDRY_PROFILE=ci forge test -vvv

      - name: Run Forge snapshot
        run: forge snapshot --check

      - name: Run Forge coverage
        run: forge coverage --report summary --no-match-coverage "(test|script|mocks)"

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
